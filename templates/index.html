<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POAP Builder</title><style>
*{box-sizing:border-box}body{font-family:Segoe UI,Arial;background:#eef3f7;margin:0;color:#17324d}.wrap{max-width:1180px;margin:35px auto;padding:20px}.hero{margin-bottom:18px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 7px 25px #0001}.drop{border:2px dashed #7b98ad;border-radius:13px;padding:32px;text-align:center;background:#f9fbfc}button,.btn{background:#1261a0;color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:600;cursor:pointer;text-decoration:none}.secondary{background:#e7eef4;color:#17324d}.danger{background:#fff0f0;color:#a22}.muted{color:#657786}.editor{display:none;margin-top:22px}.toolbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap}.poap{background:white;border-radius:16px;padding:24px;border:1px solid #dbe5ec}.titleRow{display:flex;gap:16px;align-items:center}.titleRow input{font-size:25px;font-weight:700;flex:1}.rag{width:120px;font-weight:700}.fields{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.metric{background:#f1f6f9;border-radius:10px;padding:10px}.metric label{font-size:11px;font-weight:700;color:#39709b;text-transform:uppercase}.metric input{width:100%;border:0;background:transparent;font-size:15px;font-weight:600;margin-top:5px}.two{display:grid;grid-template-columns:1fr 2fr;gap:12px}.section{border:1px solid #dbe5ec;border-radius:12px;padding:15px;margin-top:12px}.section h3{margin:0 0 10px;color:#1261a0}.row{display:grid;grid-template-columns:2fr 1fr 1.3fr 1fr auto;gap:7px;margin:7px 0}.row input,.row select,input,textarea{border:1px solid #cbd8e1;border-radius:7px;padding:8px;width:100%;font-family:inherit}.item{display:flex;gap:7px;margin:7px 0}.item input{flex:1}textarea{min-height:90px;resize:vertical}.notice{padding:10px;margin-top:10px;border-radius:8px}.ok{background:#eaf7ed}.err{background:#fff0f0;color:#8d2525}.timeline{margin-top:14px;border:1px solid #dbe5ec;border-radius:12px;padding:15px;overflow-x:auto}.timeline h3{margin:0;color:#1261a0}.track{position:relative;height:125px;min-width:760px;margin:10px 20px 0}.axis{position:absolute;left:0;right:0;top:62px;height:3px;background:#ccd9e2}.month{position:absolute;top:70px;font-size:10px;color:#657786;transform:translateX(-50%);white-space:nowrap}.tick{position:absolute;top:57px;width:1px;height:12px;background:#8799a7}.today{position:absolute;top:20px;height:72px;width:2px;background:#1261a0}.today:before{content:'TODAY';position:absolute;top:-15px;left:-17px;font-size:9px;font-weight:700;color:#1261a0}.mile{position:absolute;top:56px;width:13px;height:13px;transform:translateX(-50%) rotate(45deg);border:2px solid white}.mile.green{background:#368e4a}.mile.amber{background:#e09b20}.mile.red{background:#c43e3e}.mlabel{position:absolute;width:120px;transform:translateX(-50%);font-size:9px;text-align:center;line-height:11px}.mlabel.up{top:25px}.mlabel.down{top:89px}@media(max-width:800px){.fields{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="hero"><h1>Plan on a Page Builder</h1><p class="muted">Upload → analyse → edit → visual timeline → export.</p></div><div class="card"><form id="uploadForm"><div class="drop"><h2>Upload project plan</h2><p class="muted">MPP · XLSX · XLSM · CSV · TXT</p><input name="file" type="file" accept=".mpp,.xlsx,.xlsm,.csv,.txt" required><p><button>Analyse plan</button></p></div></form><div id="msg"></div></div><div class="editor" id="editor"><div class="toolbar"><button class="secondary" id="reset">Reset from source</button><button id="export">Export edited PowerPoint</button></div><div class="poap"><div class="titleRow"><input id="project"><select id="status" class="rag"><option>GREEN</option><option>AMBER</option><option>RED</option></select></div><div class="fields"><div class="metric"><label>Tasks</label><input id="tasks" type="number"></div><div class="metric"><label>Complete %</label><input id="completion" type="number"></div><div class="metric"><label>Start</label><input id="start" type="date"></div><div class="metric"><label>Finish</label><input id="finish" type="date"></div><div class="metric"><label>Dependencies</label><input id="dependencies" type="number"></div><div class="metric"><label>R / A / G</label><div id="ragCounts" style="margin-top:7px;font-weight:600"></div></div></div><div class="two"><div class="section"><h3>Workstreams</h3><div id="workstreams"></div><button class="secondary" onclick="addWorkstream();drawTimeline()" type="button">+ Add workstream</button></div><div class="section"><h3>Key milestones</h3><div id="milestones"></div><button class="secondary" onclick="addMilestone();drawTimeline()" type="button">+ Add milestone</button></div></div><div class="timeline"><h3>Graphical Timeline</h3><div class="track" id="track"><div class="axis"></div></div></div><div class="two"><div class="section"><h3>Risks / Attention</h3><div id="risks"></div><button class="secondary" onclick="addRisk()" type="button">+ Add item</button></div><div class="section"><h3>Executive summary</h3><textarea id="summary"></textarea></div></div></div><div id="exportMsg"></div></div></div>
<script>
let source=null,$=id=>document.getElementById(id),esc=v=>String(v??'');function addWorkstream(v=''){let d=document.createElement('div');d.className='item';d.innerHTML='<input><button type="button" class="danger">×</button>';d.querySelector('input').value=v;d.querySelector('button').onclick=()=>d.remove();$('workstreams').appendChild(d)}function addRisk(v=''){let d=document.createElement('div');d.className='item';d.innerHTML='<input><button type="button" class="danger">×</button>';d.querySelector('input').value=v;d.querySelector('button').onclick=()=>d.remove();$('risks').appendChild(d)}
function addMilestone(m={task:'',date:'',owner:'',rag:'GREEN'}){let d=document.createElement('div');d.className='row';['task','date','owner'].forEach((k,i)=>{let e=document.createElement('input');if(k==='date')e.type='date';else e.placeholder=k[0].toUpperCase()+k.slice(1);e.value=m[k]||'';e.oninput=drawTimeline;d.appendChild(e)});let s=document.createElement('select');['GREEN','AMBER','RED'].forEach(x=>s.add(new Option(x,x)));s.value=m.rag||'GREEN';s.onchange=drawTimeline;d.appendChild(s);let b=document.createElement('button');b.type='button';b.className='danger';b.textContent='×';b.onclick=()=>{d.remove();drawTimeline()};d.appendChild(b);$('milestones').appendChild(d)}
function milestoneValues(){return [...$('milestones').children].map(r=>{let e=r.querySelectorAll('input,select');return{task:e[0].value,date:e[1].value||null,owner:e[2].value||null,rag:e[3].value}})}
function drawTimeline(){let track=$('track');track.querySelectorAll(':scope > :not(.axis)').forEach(x=>x.remove());let st=new Date($('start').value+'T00:00:00'),en=new Date($('finish').value+'T00:00:00');if(isNaN(st)||isNaN(en)||en<=st)return;let span=en-st,pos=d=>Math.max(0,Math.min(100,(d-st)/span*100));let cursor=new Date(st.getFullYear(),st.getMonth(),1),n=0;while(cursor<=en&&n<36){let p=pos(cursor),tick=document.createElement('div'),lab=document.createElement('div');tick.className='tick';tick.style.left=p+'%';lab.className='month';lab.style.left=p+'%';lab.textContent=cursor.toLocaleDateString('en-GB',{month:'short',year:'2-digit'});track.append(tick,lab);cursor.setMonth(cursor.getMonth()+1);n++}let now=new Date();if(now>=st&&now<=en){let t=document.createElement('div');t.className='today';t.style.left=pos(now)+'%';track.appendChild(t)}milestoneValues().filter(m=>m.date).slice(0,12).forEach((m,i)=>{let p=pos(new Date(m.date+'T00:00:00')),dot=document.createElement('div'),lab=document.createElement('div');dot.className='mile '+m.rag.toLowerCase();dot.style.left=p+'%';lab.className='mlabel '+(i%2?'down':'up');lab.style.left=p+'%';lab.textContent=m.task;track.append(dot,lab)})}
function render(d){$('project').value=d.project;$('tasks').value=d.tasks;$('completion').value=d.completion;$('start').value=d.start||'';$('finish').value=d.finish||'';$('dependencies').value=d.dependencies;$('status').value=d.status;$('ragCounts').textContent=`${d.rag_counts?.RED||0} / ${d.rag_counts?.AMBER||0} / ${d.rag_counts?.GREEN||0}`;$('summary').value=d.executive_summary||'';$('workstreams').replaceChildren();(d.workstreams||[]).forEach(addWorkstream);$('risks').replaceChildren();(d.risks||[]).forEach(addRisk);$('milestones').replaceChildren();(d.milestones||[]).forEach(addMilestone);$('editor').style.display='block';drawTimeline();$('editor').scrollIntoView({behavior:'smooth'})}
$('start').onchange=drawTimeline;$('finish').onchange=drawTimeline;$('uploadForm').onsubmit=async e=>{e.preventDefault();$('msg').innerHTML='<div class="notice">Analysing project plan…</div>';let res=await fetch('/api/analyse',{method:'POST',body:new FormData(e.target)}),d=await res.json();if(!res.ok){$('msg').innerHTML='<div class="notice err"><b>Could not analyse:</b> '+esc(d.detail||'Unknown error')+'</div>';return}source=JSON.parse(JSON.stringify(d));$('msg').innerHTML='<div class="notice ok">Plan analysed. Review and edit the POAP below.</div>';render(d)};$('reset').onclick=()=>source&&render(JSON.parse(JSON.stringify(source)));
function collect(){return{project:$('project').value,start:$('start').value||null,finish:$('finish').value||null,tasks:+$('tasks').value||0,completion:+$('completion').value||0,dependencies:+$('dependencies').value||0,status:$('status').value,rag_counts:source?.rag_counts||{},workstreams:[...$('workstreams').querySelectorAll('input')].map(x=>x.value).filter(Boolean),milestones:milestoneValues(),risks:[...$('risks').querySelectorAll('input')].map(x=>x.value).filter(Boolean),executive_summary:$('summary').value}}$('export').onclick=async()=>{$('exportMsg').innerHTML='<div class="notice">Building edited PowerPoint…</div>';let res=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())}),d=await res.json();if(!res.ok){$('exportMsg').innerHTML='<div class="notice err">'+esc(d.detail||'Export failed')+'</div>';return}$('exportMsg').innerHTML='<div class="notice ok"><a class="btn" href="'+d.download+'">Download edited PowerPoint</a></div>'}
</script></body></html>
