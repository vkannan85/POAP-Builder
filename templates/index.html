<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POAP Generator</title>
<style>body{font-family:Segoe UI,Arial;background:#f3f6f8;margin:0;color:#17324d}.wrap{max-width:980px;margin:55px auto;padding:24px}.hero{margin-bottom:24px}.card{background:white;border-radius:18px;padding:30px;box-shadow:0 8px 30px #0001}.drop{border:2px dashed #7b98ad;border-radius:14px;padding:50px;text-align:center;background:#f9fbfc}button,.btn{background:#1261a0;color:white;border:0;border-radius:9px;padding:12px 20px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.muted{color:#657786}.result{margin-top:24px;display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{background:#eef4f7;padding:14px;border-radius:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="hero"><h1>Plan on a Page Generator</h1><p class="muted">Upload a project plan and create an editable executive POAP locally.</p></div><div class="card"><form id="f"><div class="drop"><h2>Upload project plan</h2><p>MPP · XLSX · CSV · TXT</p><input id="file" name="file" type="file" accept=".mpp,.xlsx,.xlsm,.csv,.txt" required><p><button>Generate POAP</button></p></div></form><div id="msg"></div><div class="result" id="r"><h2 id="project"></h2><div class="grid"><div class="mini"><b>Tasks</b><div id="tasks"></div></div><div class="mini"><b>Start</b><div id="start"></div></div><div class="mini"><b>Finish</b><div id="finish"></div></div><div class="mini"><b>Status</b><div id="status"></div></div><div class="mini"><b>Complete</b><div id="completion"></div></div><div class="mini"><b>Dependencies</b><div id="dependencies"></div></div></div><h3>Workstreams</h3><p id="ws"></p><h3>Attention</h3><p id="risks"></p><a class="btn" id="dl">Download editable PowerPoint</a></div></div></div>
<script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();let msg=document.getElementById('msg');msg.innerHTML='<p>Reading plan and building POAP…</p>';let fd=new FormData(e.target);let res=await fetch('/api/generate',{method:'POST',body:fd});let d=await res.json();if(!res.ok){msg.innerHTML='<p><b>Could not generate:</b> '+(d.detail||'Unknown error')+'</p>';return}msg.innerHTML='';r.style.display='block';project.textContent=d.project;tasks.textContent=d.tasks;start.textContent=d.start||'—';finish.textContent=d.finish||'—';status.textContent=d.status;completion.textContent=d.completion+'%';dependencies.textContent=d.dependencies;ws.textContent=d.workstreams.join(' • ');risks.textContent=d.risks.join(' • ')||'No rule-based risks detected';dl.href=d.download}</script></body></html>
